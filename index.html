<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0d3a5c; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas#game { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: pointer; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000b; }
  #me { top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); width: min(230px, 55vw); }
  #fishName { font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 8px; margin-top: 4px; border-radius: 6px; background: #0005; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 6px; transition: width .3s; }
  #growBar i { background: #ffd23f; } #foodBar i { background: #ff8a65; }
  #stats { font-size: 12px; font-weight: 700; margin-top: 3px; }
  #saved { font-size: 12px; opacity: 0; transition: opacity .5s; } #saved.on { opacity: .85; }
  #net { top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); font-size: 12px; font-weight: 600; text-align: right; max-width: 40vw; }

  #bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

  #say { flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 14px; padding: 0 14px; font: 500 16px system-ui, sans-serif; background: #ffffffe6; color: #1d2433; outline: none; }
  button { min-height: 44px; border: 0; border-radius: 14px; background: #f2fbff; color: #12324a; font: 700 13px system-ui, sans-serif; box-shadow: 0 2px 6px #0004; cursor: pointer; touch-action: manipulation; }
  #bar button { padding: 4px 2px; line-height: 1.1; } #bar button b { display: block; font-size: 19px; }
  #bar button.on { background: #ffd23f; }
  #decoBar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 6px; border-radius: 14px; background: #00000055; }
  #decoBar button { padding: 2px; } #decoBar button.on { outline: 3px solid #ffd23f; }
  #decoBar canvas { display: block; width: 40px; height: 40px; margin: 0 auto; }
  .panel { position: fixed; inset: 0; display: grid; place-items: center; background: #06203599; }
  .card { width: min(380px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; box-sizing: border-box; padding: 16px; border-radius: 18px; background: #f2fbff; color: #12324a; text-align: center; box-shadow: 0 10px 30px #0006; }
  .card h2 { margin: 0 0 4px; font-size: 22px; } .card p { margin: 4px 0; font-size: 14px; color: #3d6079; }
  #preview { display: block; width: 100%; height: auto; border-radius: 12px; background: linear-gradient(#4fb3e8, #1d6fa3); }
  .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 6px 0; }
  .row button { min-width: 44px; padding: 0 8px; box-shadow: none; background: #dceef8; } .row button.on { outline: 3px solid #ff8a3d; background: #fff1d6; }
  .sw { width: 44px; min-width: 44px !important; padding: 0 !important; }
  .card input { width: 100%; box-sizing: border-box; height: 44px; margin: 6px 0; border: 2px solid #c9e2f0; border-radius: 12px; padding: 0 12px; font: 700 17px system-ui, sans-serif; text-align: center; background: #fff; color: #12324a; }
  .go { width: 100%; margin-top: 8px; background: #ff8a3d; color: #fff; box-shadow: none; font-size: 17px; min-height: 48px; }
  .ghost { width: 100%; margin-top: 8px; background: #dceef8; box-shadow: none; }
  .label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #5d7f96; margin-top: 8px; }
  .card ol li.msg { list-style: none; margin-left: -26px; text-align: center; color: #3d6079; }
  .card ol { text-align: left; margin: 12px 0; padding-left: 26px; font-size: 14px; min-height: 40px; } .card li span { float: right; }
  [hidden] { display: none !important; }
  .attract .hud, .attract #dock { display: none !important; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="me"><div id="fishName"></div><div class="meter" id="growBar"><i></i></div><div class="meter" id="foodBar"><i></i></div><div id="stats"></div><div id="saved">✓ Saved</div></div>
<div class="hud" id="net">Connecting…</div>

<div id="dock">

  </div>

</div>
<div class="panel" id="maker" hidden><div class="card">

  <div class="label">Fins</div><div class="row" id="optFin"></div>
  <div class="label">Pattern</div><div class="row" id="optPat"></div>
  <div class="label">Body</div><div class="row" id="optC1"></div>
  <div class="label">Accent</div><div class="row" id="optC2"></div>
  <input id="nameIn" maxlength="14" placeholder="Name your fish" aria-label="Your fish's name">

</div></div>

  <h2>Biggest fish</h2><p>Growth points, all time</p><ol id="board"><li class="msg">Loading…</li></ol><p id="myXp"></p>
  <button class="go" id="topClose">Back to the tank</button>
</div></div>
<script>
/* ═══ FISH TANK · a Multiplayer Agent starter ════════════════════════════════════════
 * One shared aquarium. Design a fish, feed it, watch it grow. Drop-in, 1–30 players; bot fish keep it lively.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ tank size, speeds, food, growth, decorations, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   WORLD MEMORY .. how the tank survives the room emptying (same code in every starter)
 *   TANK (HOST) ... decorations, food, remembered fish and bot fish (they eat and grow, feed, tap the
 *                   glass, decorate and answer chat). Only the host writes these.
 *   FISH LOOKS .... the parts a fish is made of, and drawing any fish
 *   MY FISH ....... swimming, eating, growing, hunger, chat; your fish save
 *   DRAW .......... camera, water, sand, light, decorations, food, fish, bubbles
 *   HUD & PANELS .. meters, the fish maker, decorate bar, biggest fish
 *   INPUT ......... tap/click to swim there, keyboard, buttons, chat
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (where its fish is and which way it faces,
 *     ~10 times a second), `look` (its fish: name, shape, fins, pattern, colors, size),
 *     `say` (its last chat line, so people who join later still see it) and `hb` once a second.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `tank` (decorations,
 *     remembered fish, `rev`, and a version `v`), `food` (pellets sinking and who ate which)
 *     and `bots` (the bot fish). A new host adopts all of it.
 *   - Intents to the host: "feed" {x}, "eat" {i}, "deco" {k, x} and "undeco" {i}. The host
 *     checks them and writes `food` / `tank`. You grow when you see your id next to the
 *     pellet in food.got. "tap" is just an event: every fish near it darts away.
 *   - Your fish is YOUR save (player.data namespace CONFIG.fishNs; localStorage offline).
 *   - The tank outlives the room through WORLD MEMORY: decorations and the fish of people
 *     who visited (they swim on as remembered fish when their owners are away).
 *   - ?attract plays offline with bot fish only (the preview video is recorded from it).
 *   - Leaderboard "fish-growth": your fish's growth points.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  tankW: 1600, tankH: 900, // the tank, world px
  sandY: 820,             // where the sand starts
  surfaceY: 40,           // the water line
  seats: 8,               // bot fish fill the tank up to this many fish
  speed: 230,             // your fish's top speed, px/s (hungry fish swim slower)
  fishLen: 46,            // a level-0 fish's length, px
  sink: 70,               // food sinks this fast, px/s
  foodRestMs: 15000,      // food lies on the sand this long before it dissolves
  foodMax: 40,            // most pellets in the tank at once
  feedEach: 4,            // pellets per FEED
  feedGapMs: 2500,        // wait between your feeds
  eatReach: 26,           // px (grows with your fish)
  hungerMins: 4,          // full to starving in this many minutes
  levels: [0, 4, 10, 18, 28, 40, 55, 72, 92, 115, 140], // growth points for each level
  decoEach: 3,            // decorations one visitor can have in the tank
  decoMax: 16,            // decorations in the tank at once
  remember: 8,            // fish the tank remembers (people who visited)
  botNotice: 230,         // bot fish only go for food below this depth (people get first go at the top)
  botFeedEvery: [20000, 40000], // ms between a bot fish dropping food
  botTapEvery: [70000, 130000], // ms between a bot fish tapping the glass
  botDecoEvery: [40000, 80000], // ms between a bot fish placing (or moving) one of the bots' decorations
  botMaxSize: 7,          // made-up bot fish grow by eating, up to this size
  botReply: 0.6,          // chance a bot fish says something back when someone chats
  board: "fish-growth",   // leaderboard name
  saveNs: "fish-tank",    // world-memory save namespace
  fishNs: "fish-tank-fish", // your fish's save namespace
  saveEvery: 10000,       // ms between world-memory saves
};
const SHAPES = ["round", "long", "tall", "puffer"], FINS = ["small", "flowy", "spiky"], PATS = ["none", "stripes", "spots", "belly"];
const COLORS = ["#ff8a3d", "#ffd23f", "#ff5d8f", "#4da6ff", "#52d273", "#c77dff", "#ff5a5a", "#3de0d0", "#f4f4f4", "#2b2f45"];
const DECOR = { plant: "Plant", kelp: "Kelp", castle: "Castle", rock: "Rocks", chest: "Treasure", coral: "Coral" };
const BOT_NAMES = ["Bubbles", "Finn", "Coral", "Nemo-ish", "Sushi", "Blue", "Goldie", "Squirt", "Pebble", "Ziggy"];
const BOT_LINES = ["blub!", "🫧", "Food?", "Hi friend!", "Nice castle!", "So shiny ✨", "I love this tank", "Wheee!", "🐟💕", "zzz…"];
const BOT_FEED_LINES = ["Snack time! 🍤", "Who's hungry?", "Dinner's up!"], BOT_DECO_LINES = ["Look what I found!", "This goes here ✨", "Redecorating!"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'fish-tank',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fallback) => { if (typeof v !== "string") return fallback; try { return JSON.parse(v); } catch { return fallback; } };
const memo = new Map();
/** A shared JSON field (or an entity's), parsed once per change (read-only: never mutate what this returns). */
function field(key, raw, fallback) {
  const m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;
}
const shared = (key, fallback) => field("shared:" + key, S.shared[key], fallback);
let net = null, player = null, board = null;
let S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── WORLD MEMORY ────────────────────────────────────────────────────────────────────
// A relay room forgets everything when its last player leaves, so the PLAYERS remember the tank:
//   1. Every CONFIG.saveEvery ms and when the page closes, each player saves a copy of the live
//      tank with its `rev` (how many changes PEOPLE made; bots don't count) to its player save
//      (player.data, namespace CONFIG.saveNs) and to this browser (localStorage). A copy with a
//      higher rev than the live tank is never overwritten: it is kept and offered.
//   2. The first player into an empty room becomes host and loads its copy into shared.
//   3. A player who joins holding a copy with a HIGHER rev than the live tank offers it: it
//      writes the copy into its own entity (`wmh` header, `wm0`, `wm1`… chunks under 2048
//      characters) and the host adopts it. The copy with more changes in it wins.
// The game supplies worldSnapshot(), liveRev() (-1 = no tank yet) and loadWorld(world, rev).
const memory = { saved: null, ready: false, cloud: null, lastJson: "", lastSave: 0, offerRev: 0, offerN: 0 };
const memoryKey = () => "mpa-world:" + MP_CONNECT.room + (net.offline ? ":offline" : "");
async function loadMemory() {
  let best = null;
  try { best = JSON.parse(localStorage.getItem(memoryKey()) || "null"); } catch {}
  if (player) {
    try {
      const doc = (await player.data.get(CONFIG.saveNs)).data;
      if (doc && doc.room === MP_CONNECT.room && doc.world && (!best || doc.rev > best.rev)) best = doc;
      memory.cloud = true;
    } catch (e) { memory.cloud = false; console.warn("World memory: no cloud save, this browser only:", e && e.message); }
  }
  memory.saved = best && best.room === MP_CONNECT.room && best.world && typeof best.rev === "number" ? best : null;
  memory.lastJson = memory.saved ? JSON.stringify(memory.saved.world) : "";
  memory.ready = true;
}
function rememberWorld() {
  if (ATTRACT || !memory.ready) return;
  const rev = liveRev();
  if (rev < 0 || (memory.saved && rev < memory.saved.rev)) return; // mine is newer: keep it, keep offering it
  const doc = { room: MP_CONNECT.room, rev, at: Date.now(), world: worldSnapshot() };
  const json = JSON.stringify(doc.world);
  if (json === memory.lastJson) return;
  memory.lastJson = json; memory.saved = doc;
  try { localStorage.setItem(memoryKey(), JSON.stringify(doc)); } catch {}
  if (player && memory.cloud) {
    player.data.set(doc, { namespace: CONFIG.saveNs })
      .catch((e) => e && e.current ? player.data.set(doc, { namespace: CONFIG.saveNs, version: e.current.version }) : Promise.reject(e))
      .catch((e) => { if (e && (e.status === 401 || e.status === 403)) memory.cloud = false; });
  }
  flashSaved();
}
function offerMemory() {
  if (ATTRACT || !memory.ready) return;
  const mine = memory.saved, live = liveRev(), better = mine && mine.rev > live;
  if (isHost()) {
    if (memory.offerRev) clearOffer();
    if (better && live >= 0 && loadWorld(mine.world, mine.rev)) memoryAdopted("");
    return;
  }
  if (better && memory.offerRev !== mine.rev) {
    const json = JSON.stringify(mine.world), fields = {}, n = Math.ceil(json.length / 1900);
    if (n > 40) return;
    for (let i = 0; i < n; i++) fields["wm" + i] = "~" + json.slice(i * 1900, (i + 1) * 1900); // "~" keeps it a string
    net.me.set(fields);
    net.me.set("wmh", JSON.stringify({ room: MP_CONNECT.room, rev: mine.rev, n })); // header last: chunks land first
    memory.offerRev = mine.rev; memory.offerN = n;
  } else if (!better && memory.offerRev) clearOffer();
}
function clearOffer() {
  const fields = { wmh: "" };
  for (let i = 0; i < memory.offerN; i++) fields["wm" + i] = "";
  net.me.set(fields); memory.offerRev = 0; memory.offerN = 0;
}
function adoptOffers() {
  let best = null;
  for (const id of livePlayers()) {
    const p = S.entities.players[id], h = id !== net.sessionId && parse(p && p.wmh, null);
    if (!h || h.room !== MP_CONNECT.room || !(h.n <= 40) || !(h.rev > liveRev()) || (best && h.rev <= best.rev)) continue;
    let json = "";
    for (let i = 0; i < h.n && json !== null; i++) { const c = p["wm" + i]; json = typeof c === "string" && c[0] === "~" ? json + c.slice(1) : null; }
    const world = parse(json, null);
    if (world) best = { rev: h.rev, world, name: lookOf(id).n || "A player" };
  }
  if (best && loadWorld(best.world, best.rev)) memoryAdopted(best.name);
}
function memoryAdopted(name) {
  const text = name ? `${name} brought back the tank they remembered` : "Welcome back: the tank remembers you";
  toast(text); net.send("memory", { text: name ? text : "The host brought back the tank they remembered" });
}
function memoryTick() {
  offerMemory();
  if (isHost() && !ATTRACT) adoptOffers();
  if (performance.now() - memory.lastSave > CONFIG.saveEvery) { memory.lastSave = performance.now(); rememberWorld(); }
}
addEventListener("pagehide", () => rememberWorld());
document.addEventListener("visibilitychange", () => { if (document.hidden) rememberWorld(); });

// ── TANK (HOST) ─────────────────────────────────────────────────────────────────────
// tank = { v, rev, decor: [[id, kind, x, owner]], res: [{ u, n, l, sz }] }   (res = remembered fish)
// food = { list: [[id, x, droppedAt]], got: [[id, eaterId]] }               (pellets sink from the top)
const host = { tank: null, food: { list: [], got: [] }, bots: new Map(), adopted: false, dirtyT: false, dirtyF: false, lastT: 0, lastF: 0, lastB: 0, looksJson: "", nextId: 1, fedAt: new Map(), startedAt: 0 };
const hosting = () => isHost() && host.adopted;
const tank = () => (hosting() ? host.tank : shared("tank", null));
const food = () => (hosting() ? host.food : shared("food", { list: [], got: [] }));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const TW = CONFIG.tankW, TH = CONFIG.tankH;
const landsAt = (f) => f[2] + ((CONFIG.sandY - 8 - CONFIG.surfaceY) / CONFIG.sink) * 1000; // when a pellet reaches the sand
/** Where a pellet is now: it sinks with a little sway, then rests on the sand. */
function pelletPos(f, t = Date.now()) {
  const s = Math.max(0, t - f[2]) / 1000, y = Math.min(CONFIG.sandY - 8, CONFIG.surfaceY + s * CONFIG.sink), sway = y < CONFIG.sandY - 8 ? Math.sin(s * 2 + f[0]) * 8 : Math.sin(f[0]) * 8;
  return { x: f[1] + sway, y };
}

function defaultTank() {
  return { v: 0, rev: 0, decor: [[1, "castle", 800, ""], [2, "plant", 330, ""], [3, "kelp", 1240, ""], [4, "rock", 560, ""], [5, "coral", 1050, ""]], res: [] };
}
function adoptTank() {
  host.tank = parse(S.shared.tank, null);
  host.food = { list: [], got: [], ...parse(S.shared.food, {}) };
  host.bots.clear();
  const looks = new Map(parse(S.shared.botLooks, []).map(([i, l]) => [i, l]));
  for (const b of parse(S.shared.bots, [])) if (looks.get(b.i)) host.bots.set(b.i, newBot(b.i, looks.get(b.i), b.x, b.y));
  host.nextId = 1 + Math.max(0, ...(host.tank?.decor || []).map((d) => d[0]), ...host.food.list.map((f) => f[0]));
  host.adopted = !!host.tank;
}
function worldSnapshot() { const t = tank(); return t ? { decor: t.decor, res: t.res } : { decor: [], res: [] }; }
function liveRev() { const t = tank(); return t && typeof t.rev === "number" ? t.rev : -1; }
/** World memory: install a remembered tank (every part checked). */
function loadWorld(w, rev) {
  if (!w || !Array.isArray(w.decor) || typeof rev !== "number") return false;
  const decor = w.decor.filter((d) => Array.isArray(d) && DECOR[d[1]] && Number.isFinite(d[2])).slice(-CONFIG.decoMax).map((d, i) => [i + 1, d[1], Math.max(40, Math.min(TW - 40, d[2])), ""]);
  const res = (Array.isArray(w.res) ? w.res : []).filter((r) => r && r.u && cleanLook(r.l)).slice(-CONFIG.remember);
  host.tank = { v: host.tank?.v || 0, rev, decor, res }; host.nextId = decor.length + 1; host.adopted = true; host.dirtyT = true;
  for (const b of host.bots.values()) if (b.u) host.bots.delete(b.id); // remembered fish change: respawn them
  return true;
}
/** One intent (from a player, or from the host itself). */
function applyIntent(type, m, from) {
  if (!m || !host.tank) return;
  const t = Date.now();
  if (type === "feed") {

  }
}
$("decoBtn").onclick = () => { const bar = $("decoBar"); bar.hidden = !bar.hidden; $("decoBtn").classList.toggle("on", !bar.hidden); if (bar.hidden) me.deco = ""; else toast(`Pick a decoration, then tap the sand. You can have ${CONFIG.decoEach} in the tank.`); };
$("feedBtn").onclick = feed;
$("tapBtn").onclick = () => tapGlass(me.x + rnd(-120, 120), me.y + rnd(-80, 80));
$("fishBtn").onclick = openMaker;
$("topBtn").onclick = () => {
  $("topPanel").hidden = false; submitScore(true);
  $("myXp").textContent = hasFish() ? `${save.look.n}: ${save.xp} growth points` : "";
  const list = $("board");
  if (!board) { list.innerHTML = '<li class="msg">Leaderboards need a connection.</li>'; return; }
  list.innerHTML = '<li class="msg">Loading…</li>';
  board.top(10).then(({ entries }) => { list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : '<li class="msg">No fish yet. Yours could be first.</li>'; }).catch(() => { list.innerHTML = '<li class="msg">Couldn\'t load the leaderboard.</li>'; });
};
$("topClose").onclick = () => { $("topPanel").hidden = true; };
let audio = null;
function sfx(freq, len) {
  if (ATTRACT) return;
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), gn = audio.createGain(), t = audio.currentTime;
    o.type = "sine"; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.6, t + len);
    gn.gain.setValueAtTime(0.07, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(gn).connect(audio.destination); o.start(t); o.stop(t + len + 0.02);
  } catch {}
}
let hintUntil = 0;
function showHint() {
  $("hint").textContent = touchUI ? "Tap where you want to swim · Feed, then swim to the food · Tap glass to scare everyone 😄" : "Click where you want to swim (or WASD) · Feed, then swim to the food · Enter to chat";
  hintUntil = performance.now() + 12000;
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches;
const keys = new Set();
let hoverX = null;
const typing = () => document.activeElement === $("say") || document.activeElement === $("nameIn");
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); $("say").blur();
  const p = toTank(e.clientX, e.clientY);
  if (me.deco) { // decorating: tap one of mine to remove it, else place here
    const mineHit = (tank()?.decor || []).find((d) => d[3] === net.sessionId && Math.abs(d[2] - p.x) < 60 && p.y > CONFIG.sandY - 170);
    const m = mineHit ? { i: mineHit[0] } : { k: me.deco, x: Math.round(p.x) };
    const type = mineHit ? "undeco" : "deco";
    if (isHost()) applyIntent(type, m, net.sessionId); else net.send(type, m);
    sfx(mineHit ? 300 : 600, 0.1); bubbles(p.x, CONFIG.sandY - 20, 6);
    return;
  }
  me.tx = p.x; me.ty = p.y; drag.on = true; drag.id = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch {}
});
const drag = { on: false, id: null };
cv.addEventListener("pointermove", (e) => {
  const p = toTank(e.clientX, e.clientY);
  hoverX = me.deco ? p.x : null;
  if (drag.on && e.pointerId === drag.id) { me.tx = p.x; me.ty = p.y; }
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, () => { drag.on = false; });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
addEventListener("keydown", (e) => {
  if (typing()) { if (e.key === "Enter" && document.activeElement === $("say")) { e.preventDefault(); sendChat(); $("say").blur(); } if (e.key === "Escape") document.activeElement.blur(); return; }
  const k = e.key.toLowerCase();
  if (k === "enter") { e.preventDefault(); if ($("maker").hidden && $("topPanel").hidden) $("say").focus(); return; }
  if (k === "f") feed(); if (k === "t") tapGlass(me.x + rnd(-120, 120), me.y + rnd(-80, 80));
  if (k.startsWith("arrow") || k === " ") e.preventDefault();
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
$("say").addEventListener("keydown", (e) => { // chat keys never reach the game
  e.stopPropagation();
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendChat(); if (!touchUI && !$("say").value) $("say").blur(); } // desktop: back to swimming; phone: keep the keyboard up
  if (e.key === "Escape") $("say").blur();
});
$("nameIn").addEventListener("keydown", (e) => { e.stopPropagation(); if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("nameIn").blur(); $("makeGo").click(); } });
function readKeys() {
  const x = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
  const y = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  if (x || y) { me.tx = me.x + x * 200; me.ty = me.y + y * 200; me.keyMove = true; }
  else if (me.keyMove) { me.keyMove = false; me.tx = me.x + me.vx * 0.3; me.ty = me.y + me.vy * 0.3; }
}
document.addEventListener("touchmove", (e) => { if (e.target === cv) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
/** Chat from players: a bubble over their fish. */
function hearChat() {
  for (const id of livePlayers()) {
    if (id === net.sessionId) continue;
    const s = field("say:" + id, S.entities.players[id]?.say, null);
    if (s && s.k > (heard.get(id) || 0)) { heard.set(id, s.k); said.set(id, { text: String(s.t).slice(0, 60), until: performance.now() + 6000 }); }
  }
}
let last = performance.now(), lastHb = 0, lastHud = 0, lastSaveAt = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.adopted = false; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the tank meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (!typing()) readKeys();
  if (isHost()) hostTick(dt, now); else host.adopted = false;
  myTick(dt, Date.now());
  hearChat();
  placeCamera(dt);
  draw(now, dt);
  if (now - lastHud > 150) { lastHud = now; hud(); }
  $("hint").style.opacity = performance.now() < hintUntil ? 1 : 0;
  if (saveDirty && now - lastSaveAt > 8000) { lastSaveAt = now; saveNow(); submitScore(false); }
}

(async function start() {
  document.body.classList.toggle("attract", ATTRACT);
  if (ATTRACT) { $("net").textContent = ""; CONFIG.seats = 11; }
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("feed", (m, from) => { if (isHost()) applyIntent("feed", m, from); });
  net.on("eat", (m, from) => { if (isHost()) applyIntent("eat", m, from); });
  net.on("deco", (m, from) => { if (isHost()) applyIntent("deco", m, from); });
  net.on("undeco", (m, from) => { if (isHost()) applyIntent("undeco", m, from); });
  net.on("tap", (m) => { if (m && Number.isFinite(m.x) && Number.isFinite(m.y)) onTap(m); });
  net.on("chat", (m, from) => { if (m && typeof m.t === "string" && (m.k || 0) > (heard.get(from) || 0)) { heard.set(from, m.k || 0); said.set(from, { text: m.t.slice(0, 60), until: performance.now() + 6000 }); botReply(); } });
  net.on("memory", (m) => { if (m && typeof m.text === "string") toast(m.text.slice(0, 80)); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") { player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board); }
  host.startedAt = performance.now();
  buildDecoBar();
  setInterval(memoryTick, 1000);
  addEventListener("pagehide", () => { saveNow(); submitScore(true); });
  if (ATTRACT) {
    memory.ready = true;
    save.look = { n: "You", s: "tall", fn: "flowy", pt: "stripes", c1: "#ffd23f", c2: "#2b2f45" }; save.xp = 45; save.hunger = 50;
    me.x = me.tx = 700; me.y = me.ty = 420;
  } else {
    loadMemory();
    const mine = local.get(), cloud = player ? await loadAccountSave() : null;
    const best = [mine, cloud].filter((s) => s && cleanLook(s.look)).sort((a, b) => (b.xp || 0) - (a.xp || 0))[0];
    if (!applySave(best)) openMaker(); else { toast(`${save.look.n} missed you! 🐟`); showHint(); }
    me.x = me.tx = rnd(300, TW - 300); me.y = me.ty = rnd(200, 600);
  }
  requestAnimationFrame(frame);
})();
</script>
